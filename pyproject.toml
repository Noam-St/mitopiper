[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mitopiper"
dynamic = ["version"]
description = "Generate HPC (SGE/SLURM/LSF) job scripts for sequencing-data pipelines from ENA/SRA metadata"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Noam Shtolz", email = "shtolz@post.bgu.ac.il" }]
requires-python = ">=3.9"
dependencies = ["tabulate>=0.8"]
keywords = ["bioinformatics", "RNA-seq", "HPC", "SLURM", "SGE", "LSF", "pipeline", "mitochondria", "ENA", "SRA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mitopiper = "mitopiper.cli:main"

[project.urls]
Homepage = "https://github.com/Noam-St/Semi-automatic_csh_files_for_qsub"

[tool.setuptools]
packages = ["mitopiper"]

[tool.setuptools.dynamic]
version = { attr = "mitopiper.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
